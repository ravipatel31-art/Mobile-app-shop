name: Build iOS IPA

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Setup Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.16.0'
        channel: 'stable'
        cache: true
    
    - name: Setup Xcode
      uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: '15.0'
    
    - name: Install dependencies
      working-directory: ./mobile
      run: flutter pub get
    
    - name: Build iOS Release
      working-directory: ./mobile
      run: |
        flutter build ios --release --no-codesign --obfuscate --split-debug-info=./build/symbols
      env:
        FLUTTER_ROOT: ${{ github.workspace }}/mobile
        
    - name: Prepare for IPA export
      working-directory: ./mobile/ios
      run: |
        # Create necessary directories
        mkdir -p build
        
        # Build Xcode archive
        xcodebuild -workspace Runner.xcworkspace \
          -scheme Runner \
          -configuration Release \
          -archivePath Runner.xcarchive \
          archive \
          CODE_SIGN_IDENTITY="" \
          CODE_SIGNING_REQUIRED=NO \
          CODE_SIGNING_ALLOWED=NO \
          SKIP_INSTALL=NO \
          ARCHS=arm64
        
        # Export IPA
        xcodebuild -exportArchive \
          -archivePath Runner.xcarchive \
          -exportPath ./build \
          -exportOptionsPlist ExportOptions.plist \
          -allowProvisioningUpdates
    
    - name: Find and upload IPA
      working-directory: ./mobile/ios/build
      run: |
        # Find the IPA file
        IPA_FILE=$(find . -name "*.ipa" -type f | head -1)
        echo "Found IPA: $IPA_FILE"
        echo "IPA_SIZE=$(du -h "$IPA_FILE" | cut -f1)"
        
        # Upload to artifacts
        if [ -n "$IPA_FILE" ]; then
          echo "IPA found and will be uploaded"
          echo "$IPA_FILE" > ipa_path.txt
        else
          echo "ERROR: No IPA found in build output!"
          exit 1
        fi
    
    - name: Upload IPA Artifact
      uses: actions/upload-artifact@v4
      with:
        name: cafe-pos-ipa
        path: |
          mobile/ios/build/*.ipa
          mobile/ios/build/ipa_path.txt
        retention-days: 30
        if-no-files-found: error
