name: Build iOS IPA for iLoader

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Setup Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.16.0'
        channel: 'stable'
        cache: true
    
    - name: Install dependencies
      working-directory: ./mobile
      run: |
        flutter clean
        flutter pub get
    
    - name: Build iOS App (No Code Signing for Sideloading)
      working-directory: ./mobile
      run: |
        echo "Building iOS app for sideloading..."
        
        # Build iOS app without code signing (for iLoader/AltStore sideloading)
        flutter build ios --release --no-codesign --obfuscate --split-debug-info=./build/symbols
        
        # Check if build was successful
        if [ ! -d "build/ios/iphoneos/Runner.app" ]; then
          echo "ERROR: iOS build failed - Runner.app not found"
          ls -la build/ios/
          exit 1
        fi
        
        echo "✅ iOS build completed successfully"
        echo "Build location: build/ios/iphoneos/Runner.app"
        echo "Size: $(du -sh build/ios/iphoneos/Runner.app | cut -f1)"
    
    - name: Create IPA for Sideloading
      working-directory: ./mobile
      run: |
        # Create IPA from the built app
        APP_PATH="build/ios/iphoneos/Runner.app"
        IPA_OUTPUT="build/CafePOS.ipa"
        
        # Create temporary directory for IPA
        TEMP_DIR=$(mktemp -d)
        
        # Copy app to temp directory
        cp -r "$APP_PATH" "$TEMP_DIR/Payload/Runner.app"
        
        # Create IPA using zip
        cd "$TEMP_DIR"
        zip -qry "$IPA_OUTPUT" Payload
        
        # Clean up
        cd -
        rm -rf "$TEMP_DIR"
        
        # Verify IPA was created
        if [ -f "$IPA_OUTPUT" ]; then
          echo "✅ IPA created successfully"
          echo "IPA size: $(du -h "$IPA_OUTPUT" | cut -f1)"
          echo "IPA location: $IPA_OUTPUT"
          echo ""
          echo "📱 To install on iPhone with iLoader:"
          echo "1. Download the IPA from GitHub Actions"
          echo "2. Open iLoader on your iPhone"
          echo "3. Select the IPA file"
          echo "4. Tap 'Install'"
        else
          echo "ERROR: IPA creation failed"
          exit 1
        fi
    
    - name: Upload IPA Artifact
      uses: actions/upload-artifact@v4
      with:
        name: cafe-pos-ipa
        path: mobile/build/CafePOS.ipa
        retention-days: 30
        if-no-files-found: error
    
    - name: Upload App Bundle
      uses: actions/upload-artifact@v4
      with:
        name: cafe-pos-app
        path: mobile/build/ios/iphoneos/Runner.app
        retention-days: 30
        if-no-files-found: error
    
    - name: Create Installation Guide
      run: |
        cat > INSTALLATION_GUIDE.md << 'EOF'
        # 📱 How to Install Cafe POS on iPhone with iLoader

        ## Prerequisites
        - iPhone 17 with iOS 15 or later
        - iLoader app installed on iPhone
        - GitHub Actions build completed

        ## Installation Steps

        ### Step 1: Download the IPA
        1. Go to: https://github.com/ravipatel31-art/Mobile-app-shop/actions
        2. Click on the latest "Build iOS IPA for iLoader" workflow run
        3. Scroll down to "Artifacts" section
        4. Download `cafe-pos-ipa`

        ### Step 2: Install with iLoader
        1. Open iLoader on your iPhone
        2. Tap "Add" or "+" button
        3. Select the downloaded IPA file
        4. Wait for installation to complete
        5. Tap "Install" to confirm

        ### Step 3: Trust the App
        1. Go to Settings > General > VPN & Device Management
        2. Find "Cafe POS" or your developer
        3. Tap "Trust Cafe POS"
        4. Confirm trust

        ### Step 4: Launch the App
        1. Open iLoader
        2. Find "Cafe POS" in your apps
        3. Tap to launch

        ## Troubleshooting

        ### App Won't Open
        - Make sure you've trusted the app in Settings
        - Reinstall the IPA
        - Ensure iOS is up to date

        ### Installation Failed
        - Check that you downloaded the correct IPA
        - Make sure iLoader is updated
        - Try a different iOS version

        ### "Untrusted Developer" Error
        - Go to Settings > General > VPN & Device Management
        - Trust the app certificate
        - Restart the app

        ## Build Information
        - App Name: Cafe POS
        - Build Type: IPA (for sideloading)
        - Code Signing: None (for testing)
        - Compatible with: iPhone 17, iOS 15+

        ## Need Help?
        - Check the workflow logs for build errors
        - Ensure you have the latest Flutter version
        - Try building locally if GitHub Actions fails
        EOF
        cat INSTALLATION_GUIDE.md
    
    - name: Upload Installation Guide
      uses: actions/upload-artifact@v4
      with:
        name: installation-guide
        path: INSTALLATION_GUIDE.md
        retention-days: 30
