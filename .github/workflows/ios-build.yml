name: Build iOS IPA for iLoader

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Setup Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.16.0'
        channel: 'stable'
        cache: true
    
    - name: Install dependencies
      working-directory: ./mobile
      run: |
        echo "Installing Flutter dependencies..."
        flutter clean
        flutter pub get
    
    - name: Build iOS IPA (Proper Method)
      working-directory: ./mobile
      run: |
        echo "Building iOS IPA for sideloading..."
        echo "================================"
        
        # Build iOS app without code signing (for iLoader/AltStore sideloading)
        echo "Step 1: Building iOS app..."
        flutter build ipa --release --no-codesign
        
        # Check if build was successful
        if [ ! -f "build/ios/ipa/app-release.ipa" ]; then
          echo "ERROR: IPA build failed - app-release.ipa not found"
          ls -la build/ios/ipa/
          exit 1
        fi
        
        echo ""
        echo "✅ iOS IPA build completed successfully!"
        echo "================================"
        echo "IPA location: build/ios/ipa/app-release.ipa"
        echo "IPA size: $(du -h build/ios/ipa/app-release.ipa | cut -f1)"
        echo ""
        echo "To install on iPhone with iLoader:"
        echo "1. Download the IPA from GitHub Actions"
        echo "2. Open iLoader on your iPhone"
        echo "3. Select the IPA file"
        echo "4. Tap 'Install'"
    
    - name: Verify IPA Size
      working-directory: ./mobile
      run: |
        IPA_FILE="build/ios/ipa/app-release.ipa"
        
        if [ ! -f "$IPA_FILE" ]; then
          echo "ERROR: IPA file not found!"
          exit 1
        fi
        
        IPA_SIZE=$(du -h "$IPA_FILE" | cut -f1)
        IPA_BYTES=$(stat -f%z "$IPA_FILE" 2>/dev/null || stat -c%s "$IPA_FILE" 2>/dev/null || echo "0")
        
        echo "IPA Size: $IPA_SIZE"
        echo "IPA Bytes: $IPA_BYTES"
        
        if [ "$IPA_BYTES" -lt 10000000 ]; then
          echo "ERROR: IPA is too small! It should be at least 10MB"
          echo "This indicates the build failed"
          exit 1
        fi
        
        echo "✅ IPA size is correct"
    
    - name: Upload IPA Artifact
      uses: actions/upload-artifact@v4
      with:
        name: cafe-pos-ipa
        path: mobile/build/ios/ipa/app-release.ipa
        retention-days: 30
        if-no-files-found: error
    
    - name: Upload Build Info
      run: |
        echo "## ✅ Build Successful!" > $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "iOS IPA has been built successfully!" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "**App Name:** Cafe POS" >> $GITHUB_STEP_SUMMARY
        echo "**Build Type:** IPA (for sideloading)" >> $GITHUB_STEP_SUMMARY
        echo "**Code Signing:** None (for testing)" >> $GITHUB_STEP_SUMMARY
        echo "**Compatible with:** iPhone 17, iOS 15+" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "**To install on iPhone with iLoader:**" >> $GITHUB_STEP_SUMMARY
        echo "1. Go to Actions tab" >> $GITHUB_STEP_SUMMARY
        echo "2. Click on the completed workflow run" >> $GITHUB_STEP_SUMMARY
        echo "3. Scroll to 'Artifacts' section" >> $GITHUB_STEP_SUMMARY
        echo "4. Download `cafe-pos-ipa`" >> $GITHUB_STEP_SUMMARY
        echo "5. Open iLoader on your iPhone" >> $GITHUB_STEP_SUMMARY
        echo "6. Install the IPA" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "**Build details:**" >> $GITHUB_STEP_SUMMARY
        echo "- Flutter version: 3.16.0" >> $GITHUB_STEP_SUMMARY
        echo "- Build time: $(date)" >> $GITHUB_STEP_SUMMARY
        echo "- No code signing required" >> $GITHUB_STEP_SUMMARY
