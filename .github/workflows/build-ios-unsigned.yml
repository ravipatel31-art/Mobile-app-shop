name: Build iOS IPA (unsigned)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'mobile/**'

jobs:
  build:
    runs-on: macos-15
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build Flutter iOS (genkernel only)
        run: |
          flutter build ios --release --no-codesign \
            --dart-define=API_BASE_URL="https://mobileapp.unonomercysound.online"

      - name: Build IPA with xcodebuild (no signing)
        run: |
          cd ios
          xcodebuild -workspace Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -derivedDataPath ../build/ios \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            DEVELOPMENT_TEAM="" \
            PROVISIONING_PROFILE="" \
            PRODUCT_BUNDLE_IDENTIFIER=com.ravi.cafeapp \
            ENABLE_BITCODE=NO \
            archive \
            ARCHIVE_PATH="../build/ios/archive/Runner.xcarchive"

      - name: Export unsigned IPA
        run: |
          mkdir -p Payload
          cp -r build/ios/archive/Runner.xcarchive/Products/Applications/Runner.app Payload/
          zip -r cafe-app-unsigned.ipa Payload
          rm -rf Payload

      - uses: actions/upload-artifact@v4
        with:
          name: cafe-ios-ipa-unsigned
          path: mobile/cafe-app-unsigned.ipa
