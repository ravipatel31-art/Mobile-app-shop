name: Build iOS IPA (unsigned — for sideloading)

# Builds a proper Flutter IPA that you can install on your iPhone with a
# sideloading tool (iLoader / AltStore / Sideloadly / Scarlet).
#
# WHY `flutter build ipa` DOESN'T WORK HERE:
#   `flutter build ipa` (even with --no-codesign) runs Xcode's archive+export
#   pipeline, which REQUIRES a DEVELOPMENT_TEAM (a paid Apple Developer
#   account). Without one, the export fails.
#
#   We instead:
#     1. Patch the Xcode project to disable code signing entirely
#        (CODE_SIGN_STYLE=Manual, CODE_SIGN_IDENTITY=-, ENABLE_CODE_SIGNING=NO)
#     2. Run `flutter build ios --release --no-codesign`, which skips the
#        archive/export pipeline and writes a raw Runner.app bundle.
#     3. Wrap Runner.app in a Payload/ folder and zip it — that IS an .ipa.
#
#   The result is an UNSIGNED ipa. Your sideloading tool re-signs it with
#   your own Apple ID on install, so it runs on your device for 7 days
#   (free Apple ID) or 1 year (paid account).

on:
  workflow_dispatch: # Run manually from the Actions tab
  push:
    branches: [main]
    paths:
      - 'mobile/**'
      - '.github/workflows/build-ios-unsigned.yml'

jobs:
  build:
    runs-on: macos-15
    defaults:
      run:
        working-directory: mobile

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Show Flutter & Xcode versions
        run: |
          flutter --version
          xcodebuild -version

      # This is ESSENTIAL. Without it, `flutter build ios` fails with
      # "Building a deployable iOS app requires a selected Development Team"
      # because the project is set to CODE_SIGN_STYLE=Automatic.
      - name: Patch Xcode project for unsigned build
        run: |
          set -euo pipefail
          PBX="ios/Runner.xcodeproj/project.pbxproj"
          echo "Patching $PBX to disable code signing..."

          # Switch from automatic to manual signing
          sed -i '' 's/CODE_SIGN_STYLE = Automatic;/CODE_SIGN_STYLE = Manual;/g' "$PBX"
          # Use ad-hoc / no identity ("-") instead of "iPhone Developer"
          sed -i '' 's/"CODE_SIGN_IDENTITY\[sdk=iphoneos\*\]" = "iPhone Developer";/"CODE_SIGN_IDENTITY[sdk=iphoneos*]" = "-";/g' "$PBX"
          sed -i '' 's/"CODE_SIGN_IDENTITY" = "iPhone Developer";/"CODE_SIGN_IDENTITY" = "-";/g' "$PBX"
          # Remove any DEVELOPMENT_TEAM entries (not needed for unsigned)
          sed -i '' '/DEVELOPMENT_TEAM/d' "$PBX"
          # Force code signing off for all build configurations
          sed -i '' 's/ENABLE_CODE_SIGNING = YES;/ENABLE_CODE_SIGNING = NO;/g' "$PBX"

          echo "Patched. Signing-related lines now:"
          grep -n "CODE_SIGN_STYLE\|CODE_SIGN_IDENTITY\|DEVELOPMENT_TEAM\|ENABLE_CODE_SIGNING" "$PBX" || true

      - name: Install CocoaPods dependencies
        run: |
          set -euo pipefail
          cd ios
          pod install --repo-update
          cd ..

      # Flutter 3.47's `flutter build ios` refuses to finish without a
      # DEVELOPMENT_TEAM even with --no-codesign, so it can't produce a
      # runnable Runner.app on its own here. We still run it once because it
      # downloads the iOS engine + does Dart setup that xcodebuild relies on
      # (the exit code is expected to be non-zero, hence `|| true`).
      - name: Prepare Flutter iOS build environment
        run: |
          flutter build ios --release --no-codesign \
            --dart-define=API_BASE_URL="https://mobileapp.unonomercysound.online" \
            || echo "::warning::flutter build ios exited non-zero (expected on CI). Continuing with direct xcodebuild."

      # This is the build that actually works. Calling xcodebuild directly
      # with code signing force-disabled bypasses Flutter's DEVELOPMENT_TEAM
      # gate. The Flutter "Run Flutter Build" script phase compiles the Dart
      # AOT code as part of this same xcodebuild invocation.
      - name: Build iOS app with xcodebuild (signing disabled)
        run: |
          set -euo pipefail
          xcodebuild \
            -workspace ios/Runner.xcworkspace \
            -scheme Runner \
            -sdk iphoneos \
            -configuration Release \
            -derivedDataPath build/ios \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            DEVELOPMENT_TEAM="" \
            ENABLE_BITCODE=NO \
            ONLY_ACTIVE_ARCH=NO

          echo ""
          echo "xcodebuild finished. Looking for Runner.app..."
          find build/ios -maxdepth 6 -name "Runner.app" -type d

      - name: Package Runner.app into a .ipa
        run: |
          set -euo pipefail

          # Locate Runner.app. Depending on Flutter/Xcode version it can land
          # in a few places — search them all.
          APP_PATH=""
          for dir in \
            build/ios/Build/Products/Release-iphoneos/Runner.app \
            build/ios/iphoneos/Runner.app \
            build/ios/Release-iphoneos/Runner.app; do
            if [ -d "$dir" ]; then
              APP_PATH="$dir"
              break
            fi
          done

          if [ -z "$APP_PATH" ]; then
            echo "::error::Runner.app not found anywhere under build/ios."
            find build/ios -name "*.app" -type d 2>/dev/null || true
            exit 1
          fi

          echo "Found Runner.app at: $APP_PATH"
          echo "Binary size:"
          ls -lh "$APP_PATH/Runner" || true

          # An .ipa is just a zip with this layout:
          #   Payload/
          #     Runner.app/
          #       ... (the app bundle contents)
          rm -rf Payload
          mkdir Payload
          cp -R "$APP_PATH" Payload/

          rm -f cafe-pos-unsigned.ipa
          # -y stores symlinks as links (required for iOS bundles)
          # -q quiet, -r recursive, -9 max compression
          zip -qry -9 cafe-pos-unsigned.ipa Payload
          rm -rf Payload

          echo ""
          echo "IPA created:"
          ls -lh cafe-pos-unsigned.ipa

      - name: Verify IPA is a real build (size + contents)
        run: |
          set -euo pipefail
          IPA="cafe-pos-unsigned.ipa"

          IPA_BYTES=$(stat -f%z "$IPA")
          echo "IPA size: $IPA_BYTES bytes ($(ls -lh "$IPA" | awk '{print $5}'))"

          # A real Flutter iOS app is at least ~15 MB. Anything smaller means
          # the build silently failed and we uploaded an empty shell.
          if [ "$IPA_BYTES" -lt 15000000 ]; then
            echo "::error::IPA is only $IPA_BYTES bytes — too small to be a real app. Aborting."
            exit 1
          fi

          # Sanity-check that the zip actually contains a Payload/Runner.app
          echo "IPA contents (top level):"
          unzip -l "$IPA" | head -20
          if ! unzip -l "$IPA" | grep -q "Payload/Runner.app/"; then
            echo "::error::IPA does not contain Payload/Runner.app — not a valid IPA."
            exit 1
          fi

          echo ""
          echo "IPA looks valid."

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: cafe-pos-ipa
          path: mobile/cafe-pos-unsigned.ipa
          retention-days: 30
          if-no-files-found: error

      - name: Write build summary
        run: |
          {
            echo "## ✅ Cafe POS IPA built successfully"
            echo ""
            echo "Download the **cafe-pos-ipa** artifact below, rename it from \`.zip\` to \`.ipa\`, then install with iLoader / AltStore / Sideloadly."
            echo ""
            echo "### Install on iPhone"
            echo "1. Download the \`cafe-pos-ipa\` artifact and unzip it."
            echo "2. You get \`cafe-pos-unsigned.ipa\` — send it to your iPhone (AirDrop / Files app)."
            echo "3. Open **iLoader**, tap **+ / Add**, select the .ipa, tap **Install**."
            echo "4. After install: **Settings → General → VPN & Device Management** → trust your Apple ID."
            echo "5. Launch **Cafe POS** from your home screen."
            echo ""
            echo "> **Note:** This IPA is unsigned. Your sideloading tool re-signs it with your Apple ID. A free Apple ID expires after **7 days** (re-install to renew). A paid developer account lasts **1 year**."
            echo ""
            echo "### Build details"
            echo "- Runner: \`macos-15\`"
            echo "- Method: patched Xcode project (signing off) + \`flutter build ios --no-codesign\` + Payload zip"
            echo "- Bundle ID: \`com.ravi.cafeapp\`"
            echo "- API: \`https://mobileapp.unonomercysound.online\`"
            echo "- Built: $(date -u '+%Y-%m-%d %H:%M UTC')"
          } >> "$GITHUB_STEP_SUMMARY"
