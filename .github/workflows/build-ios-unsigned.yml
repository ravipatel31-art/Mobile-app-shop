name: Build iOS IPA (unsigned)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2

      - name: Install dependencies
        run: flutter pub get

      - name: Patch Xcode project to disable signing
        run: |
          python3 -c "
          import re
          with open('ios/Runner.xcodeproj/project.pbxproj', 'r') as f:
              content = f.read()
          content = content.replace('CODE_SIGN_STYLE = Automatic;', 'CODE_SIGN_STYLE = Manual;')
          content = content.replace('DEVELOPMENT_TEAM = \"\";', 'DEVELOPMENT_TEAM = \"\";')
          content = re.sub(r'PROVISIONING_PROFILE_SPECIFIER\s*=\s*"[^"]*";', 'PROVISIONING_PROFILE_SPECIFIER = "";', content)
          with open('ios/Runner.xcodeproj/project.pbxproj', 'w') as f:
              f.write(content)
          "

      - name: Create ExportOptions.plist
        run: |
          cat > /tmp/ExportOptions.plist << 'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>development</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>compileBitcode</key>
            <false/>
            <key>thinning</key>
            <string>&lt;none&gt;</string>
          </dict>
          </plist>
          EOF

      - name: Build unsigned IPA
        env:
          API_BASE_URL: ${{ vars.API_BASE_URL }}
        run: |
          if [ -z "$API_BASE_URL" ]; then
            echo "::error::Repository variable API_BASE_URL is not set"
            exit 1
          fi
          flutter build ipa --no-codesign \
            --dart-define=API_BASE_URL="$API_BASE_URL" \
            --export-options-plist=/tmp/ExportOptions.plist

      - uses: actions/upload-artifact@v4
        with:
          name: cafe-ios-ipa-unsigned
          path: mobile/build/ios/ipa/*.ipa
