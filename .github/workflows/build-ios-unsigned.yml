name: Build iOS IPA (unsigned)

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: macos-15
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Patch Xcode project to remove team requirement
        run: |
          PBX="ios/Runner.xcodeproj/project.pbxproj"
          sed -i '' 's/CODE_SIGN_STYLE = Automatic;/CODE_SIGN_STYLE = Manual;/g' "$PBX"
          sed -i '' 's/"CODE_SIGN_IDENTITY\[sdk=iphoneos\*\]" = "iPhone Developer";/"CODE_SIGN_IDENTITY[sdk=iphoneos*]" = "-";/g' "$PBX"
          sed -i '' '/DEVELOPMENT_TEAM/d' "$PBX"

      - name: Install CocoaPods
        run: cd ios && pod install

      - name: Build with xcodebuild
        run: |
          cd ios
          xcodebuild \
            -workspace Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -derivedDataPath ../build/ios/device \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            DEVELOPMENT_TEAM="" \
            ENABLE_BITCODE=NO \
            2>&1 | tail -40
          echo "xcodebuild exit: ${PIPESTATUS[0]}"

      - name: Package IPA
        run: |
          APP_PATH=$(find build/ios/device -name "Runner.app" -type d | head -1)
          if [ -z "$APP_PATH" ]; then
            echo "::error::Runner.app not found"
            find build/ios -name "Runner.app" -type d 2>/dev/null
            exit 1
          fi
          echo "Found Runner.app: $APP_PATH"
          ls -lh "$APP_PATH/Runner" 2>/dev/null || true
          rm -rf Payload cafe-app-unsigned.ipa
          mkdir Payload
          cp -r "$APP_PATH" Payload/
          zip -r cafe-app-unsigned.ipa Payload
          rm -rf Payload
          ls -lh cafe-app-unsigned.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: cafe-ios-ipa-unsigned
          path: mobile/cafe-app-unsigned.ipa
          retention-days: 30
