name: Build iOS IPA (unsigned)

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: macos-15
    defaults:
      run:
        working-directory: mobile
    env:
      DEVELOPMENT_TEAM: "placeholder"
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Patch Xcode project
        run: |
          PBX="ios/Runner.xcodeproj/project.pbxproj"
          sed -i '' 's/CODE_SIGN_STYLE = Automatic;/CODE_SIGN_STYLE = Manual;/g' "$PBX"
          sed -i '' 's/"CODE_SIGN_IDENTITY\[sdk=iphoneos\*\]" = "iPhone Developer";/"CODE_SIGN_IDENTITY[sdk=iphoneos*]" = "-";/g' "$PBX"
          sed -i '' '/DEVELOPMENT_TEAM/d' "$PBX"

      - name: Build iOS (Flutter handles pod install + dart compilation)
        run: |
          flutter build ios --release --no-codesign \
            --dart-define=API_BASE_URL="https://mobileapp.unonomercysound.online"

      - name: Package IPA from build
        run: |
          for dir in \
            build/ios/iphoneos/Runner.app \
            build/ios/Release-iphoneos/Runner.app; do
            if [ -d "$dir" ]; then
              APP_PATH="$dir"
              break
            fi
          done
          if [ -z "$APP_PATH" ]; then
            echo "::error::Runner.app not found"
            find build/ios -name "Runner.app" -type d 2>/dev/null
            exit 1
          fi
          echo "Found Runner.app at: $APP_PATH"
          ls -lh "$APP_PATH/Runner" 2>/dev/null || true
          rm -rf Payload cafe-app-unsigned.ipa
          mkdir Payload
          cp -r "$APP_PATH" Payload/
          zip -r cafe-app-unsigned.ipa Payload
          rm -rf Payload
          ls -lh cafe-app-unsigned.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: cafe-ios-ipa-unsigned
          path: mobile/cafe-app-unsigned.ipa
          retention-days: 30
