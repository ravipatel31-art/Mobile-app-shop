name: Build iOS IPA (unsigned)

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: macos-15
    defaults:
      run:
        working-directory: mobile
    env:
      DEVELOPMENT_TEAM: ""
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Patch Xcode project for unsigned build
        run: |
          PBX="ios/Runner.xcodeproj/project.pbxproj"
          # Switch to manual signing
          sed -i '' 's/CODE_SIGN_STYLE = Automatic;/CODE_SIGN_STYLE = Manual;/g' "$PBX"
          # Use ad-hoc / no identity
          sed -i '' 's/"CODE_SIGN_IDENTITY\[sdk=iphoneos\*\]" = "iPhone Developer";/"CODE_SIGN_IDENTITY[sdk=iphoneos*]" = "-";/g' "$PBX"
          sed -i '' 's/"CODE_SIGN_IDENTITY" = "iPhone Developer";/"CODE_SIGN_IDENTITY" = "-";/g' "$PBX"
          # Remove all DEVELOPMENT_TEAM entries
          sed -i '' '/DEVELOPMENT_TEAM/d' "$PBX"
          # Disable code signing for all build configs
          sed -i '' 's/ENABLE_CODE_SIGNING = YES;/ENABLE_CODE_SIGNING = NO;/g' "$PBX"

      - name: Install CocoaPods dependencies
        run: |
          cd ios
          pod install --repo-update
          cd ..

      - name: Build iOS with xcodebuild (unsigned)
        run: |
          flutter build ios --release --no-codesign \
            --dart-define=API_BASE_URL="https://mobileapp.unonomercysound.online" || true

          # Fallback: build with xcodebuild directly if flutter build fails
          xcodebuild \
            -workspace ios/Runner.xcworkspace \
            -scheme Runner \
            -sdk iphoneos \
            -configuration Release \
            -derivedDataPath build/ios \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            DEVELOPMENT_TEAM="" \
            ENABLE_BITCODE=NO \
            ONLY_ACTIVE_ARCH=NO || true

          # Verify Runner.app exists
          echo "Looking for Runner.app..."
          find build/ios -name "Runner.app" -type d 2>/dev/null

      - name: Package IPA
        run: |
          # Find Runner.app in various possible locations
          APP_PATH=""
          for dir in \
            build/ios/Build/Products/Release-iphoneos/Runner.app \
            build/ios/iphoneos/Runner.app \
            build/ios/Release-iphoneos/Runner.app; do
            if [ -d "$dir" ]; then
              APP_PATH="$dir"
              break
            fi
          done
          
          if [ -z "$APP_PATH" ]; then
            echo "::error::Runner.app not found. Listing build/ios contents:"
            find build/ios -name "*.app" -type d 2>/dev/null
            find build/ios -name "Runner*" -type d 2>/dev/null
            ls -la build/ios/ 2>/dev/null || echo "build/ios not found"
            ls -la build/ios/Build/Products/ 2>/dev/null || echo "Products dir not found"
            exit 1
          fi
          
          echo "Found Runner.app at: $APP_PATH"
          ls -lh "$APP_PATH/Runner" 2>/dev/null || true
          
          rm -rf Payload cafe-app-unsigned.ipa
          mkdir Payload
          cp -r "$APP_PATH" Payload/
          zip -r cafe-app-unsigned.ipa Payload
          rm -rf Payload
          ls -lh cafe-app-unsigned.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: cafe-ios-ipa-unsigned
          path: mobile/cafe-app-unsigned.ipa
          retention-days: 30
