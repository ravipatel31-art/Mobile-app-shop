name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Setup Java
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'
    
    - name: Setup Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.16.0'
        channel: 'stable'
        cache: true
    
    - name: Install dependencies
      working-directory: ./mobile
      run: |
        flutter clean
        flutter pub get
    
    - name: Build Android APK
      working-directory: ./mobile
      run: |
        echo "Building Android APK..."
        
        # Build release APK
        flutter build apk --release --split-per-abi
        
        # Check if build was successful
        if [ ! -f "build/app/outputs/flutter-apk/app-arm64-v8a-release.apk" ]; then
          echo "ERROR: APK build failed"
          ls -la build/app/outputs/flutter-apk/
          exit 1
        fi
        
        echo "✅ APK build completed successfully"
        echo "APK size: $(du -h build/app/outputs/flutter-apk/app-arm64-v8a-release.apk | cut -f1)"
    
    - name: Upload APK Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: cafe-pos-apk
        path: |
          mobile/build/app/outputs/flutter-apk/*.apk
        retention-days: 30
        if-no-files-found: error
    
    - name: Create Build Summary
      run: |
        echo "## ✅ Build Successful!" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "Android APK has been built successfully!" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "**APK Location:**" >> $GITHUB_STEP_SUMMARY
        echo "\`mobile/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk\`" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "**To install on your phone:**" >> $GITHUB_STEP_SUMMARY
        echo "1. Download the APK artifact" >> $GITHUB_STEP_SUMMARY
        echo "2. Copy it to your phone" >> $GITHUB_STEP_SUMMARY
        echo "3. Tap to install" >> $GITHUB_STEP_SUMMARY
