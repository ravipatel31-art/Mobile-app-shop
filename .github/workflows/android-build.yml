name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Setup Java
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'
    
    - name: Setup Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.16.0'
        channel: 'stable'
        cache: true
    
    - name: Install dependencies
      working-directory: ./mobile
      run: |
        echo "Installing Flutter dependencies..."
        flutter clean
        flutter pub get
    
    - name: Build Android APK
      working-directory: ./mobile
      run: |
        echo "Building Android APK..."
        echo "================================"
        
        # Build release APK
        echo "Step 1: Building Android APK..."
        flutter build apk --release --split-per-abi
        
        # Check if build was successful
        if [ ! -f "build/app/outputs/flutter-apk/app-arm64-v8a-release.apk" ]; then
          echo "ERROR: APK build failed"
          ls -la build/app/outputs/flutter-apk/
          exit 1
        fi
        
        echo ""
        echo "✅ Android APK build completed successfully!"
        echo "================================"
        echo "APK location: build/app/outputs/flutter-apk/app-arm64-v8a-release.apk"
        echo "APK size: $(du -h build/app/outputs/flutter-apk/app-arm64-v8a-release.apk | cut -f1)"
        echo ""
        echo "To install on Android:"
        echo "1. Download the APK from GitHub Actions"
        echo "2. Copy to your phone"
        echo "3. Tap to install"
    
    - name: Verify APK Size
      working-directory: ./mobile
      run: |
        APK_FILE="build/app/outputs/flutter-apk/app-arm64-v8a-release.apk"
        
        if [ ! -f "$APK_FILE" ]; then
          echo "ERROR: APK file not found!"
          exit 1
        fi
        
        APK_SIZE=$(du -h "$APK_FILE" | cut -f1)
        APK_BYTES=$(stat -f%z "$APK_FILE" 2>/dev/null || stat -c%s "$APK_FILE" 2>/dev/null || echo "0")
        
        echo "APK Size: $APK_SIZE"
        echo "APK Bytes: $APK_BYTES"
        
        if [ "$APK_BYTES" -lt 5000000 ]; then
          echo "ERROR: APK is too small! It should be at least 5MB"
          echo "This indicates the build failed"
          exit 1
        fi
        
        echo "✅ APK size is correct"
    
    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: cafe-pos-apk
        path: mobile/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
        retention-days: 30
        if-no-files-found: error
    
    - name: Create Build Summary
      run: |
        echo "## ✅ Build Successful!" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "Android APK has been built successfully!" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "**App Name:** Cafe POS" >> $GITHUB_STEP_SUMMARY
        echo "**Build Type:** APK (for sideloading)" >> $GITHUB_STEP_SUMMARY
        echo "**Compatible with:** Android 8.0+" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "**To install on Android:**" >> $GITHUB_STEP_SUMMARY
        echo "1. Go to Actions tab" >> $GITHUB_STEP_SUMMARY
        echo "2. Click on the completed workflow run" >> $GITHUB_STEP_SUMMARY
        echo "3. Scroll to 'Artifacts' section" >> $GITHUB_STEP_SUMMARY
        echo "4. Download `cafe-pos-apk`" >> $GITHUB_STEP_SUMMARY
        echo "5. Copy to your phone" >> $GITHUB_STEP_SUMMARY
        echo "6. Tap to install" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "**Build details:**" >> $GITHUB_STEP_SUMMARY
        echo "- Flutter version: 3.16.0" >> $GITHUB_STEP_SUMMARY
        echo "- Build time: $(date)" >> $GITHUB_STEP_SUMMARY
        echo "- No signing required" >> $GITHUB_STEP_SUMMARY
