name: Build iOS IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-15
    defaults:
      run:
        working-directory: mobile
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build iOS
        env:
          API_BASE_URL: ${{ vars.API_BASE_URL }}
          DEVELOPMENT_TEAM: ""
        run: |
          if [ -z "$API_BASE_URL" ]; then
            echo "::error::Repository variable API_BASE_URL is not set"
            exit 1
          fi
          flutter clean
          flutter pub get
          # Write xcconfig to override signing settings AFTER pub get
          echo 'DEVELOPMENT_TEAM =' > ios/Flutter/Release.xcconfig
          echo 'CODE_SIGN_STYLE = Manual' >> ios/Flutter/Release.xcconfig
          echo 'CODE_SIGN_IDENTITY = -' >> ios/Flutter/Release.xcconfig
          echo 'CODE_SIGNING_REQUIRED = NO' >> ios/Flutter/Release.xcconfig
          echo 'CODE_SIGNING_ALLOWED = NO' >> ios/Flutter/Release.xcconfig
          flutter build ios --release --no-codesign \
            --dart-define=API_BASE_URL="$API_BASE_URL"

      - name: Package IPA
        run: |
          for dir in \
            build/ios/iphoneos/Runner.app \
            build/ios/Release-iphoneos/Runner.app \
            build/ios/Debug-iphoneos/Runner.app; do
            if [ -d "$dir" ]; then
              APP_PATH="$dir"
              break
            fi
          done
          if [ -z "$APP_PATH" ]; then
            echo "::error::Runner.app not found"
            find build/ios -name "Runner.app" -type d 2>/dev/null
            exit 1
          fi
          echo "Found Runner.app at: $APP_PATH"
          if [ ! -f "$APP_PATH/Runner" ]; then
            echo "::error::Runner.app is incomplete - missing Runner binary"
            ls -la "$APP_PATH/"
            exit 1
          fi
          ls -lh "$APP_PATH/Runner"
          mkdir Payload
          cp -r "$APP_PATH" Payload/
          zip -r cafe-app-unsigned.ipa Payload
          rm -rf Payload
          ls -lh cafe-app-unsigned.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: cafe-ios-ipa
          path: mobile/cafe-app-unsigned.ipa
          retention-days: 30
