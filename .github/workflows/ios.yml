name: Build iOS IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: cd mobile && flutter pub get

      - name: Boot simulator and build
        env:
          API_BASE_URL: ${{ vars.API_BASE_URL }}
        run: |
          cd mobile
          SIM_ID=$(xcrun simctl list devices available -j | python3 -c "
          import sys, json
          devs = json.load(sys.stdin)['devices']
          for runtime, devices in devs.items():
              for d in devices:
                  if d['isAvailable'] and 'iPhone' in d['name']:
                      print(d['udid'])
                      sys.exit(0)
          ")
          echo "Using simulator: $SIM_ID"
          xcrun simctl boot "$SIM_ID" || true
          flutter build ios --release --no-codesign \
            -d "$SIM_ID" \
            --dart-define=API_BASE_URL="$API_BASE_URL"
          mkdir Payload
          cp -r build/ios/simulator/Runner.app Payload/
          zip -r cafe-app-unsigned.ipa Payload
          rm -rf Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: cafe-ios-ipa
          path: mobile/cafe-app-unsigned.ipa
          retention-days: 30

      - name: Flutter build info
        run: |
          echo "Flutter build completed"
          echo "IPA location: mobile/build/ios/ipa/"