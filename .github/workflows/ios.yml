name: Build iOS IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: cd mobile && flutter pub get

      - name: Build unsigned IPA
        env:
          API_BASE_URL: ${{ vars.API_BASE_URL }}
        run: |
          cd mobile
          flutter build ios --release --no-codesign \
            --dart-define=API_BASE_URL="$API_BASE_URL"
          mkdir Payload
          cp -r build/ios/simulator/Runner.app Payload/
          zip -r cafe-app-unsigned.ipa Payload
          rm -rf Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: cafe-ios-ipa
          path: mobile/cafe-app-unsigned.ipa
          retention-days: 30

      - name: Flutter build info
        run: |
          echo "Flutter build completed"
          echo "IPA location: mobile/build/ios/ipa/"