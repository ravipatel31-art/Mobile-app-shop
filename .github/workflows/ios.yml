name: Build iOS IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-15
    defaults:
      run:
        working-directory: mobile
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Clean and build
        env:
          API_BASE_URL: ${{ vars.API_BASE_URL }}
        run: |
          if [ -z "$API_BASE_URL" ]; then
            echo "::error::Repository variable API_BASE_URL is not set"
            exit 1
          fi
          flutter clean
          flutter pub get
          flutter build ios --release --no-codesign \
            --dart-define=API_BASE_URL="$API_BASE_URL" || true
          # Check both debug and release output paths
          if [ -d "build/ios/iphoneos/Runner.app" ]; then
            APP_DIR="build/ios/iphoneos/Runner.app"
          elif [ -d "build/ios/Debug-iphoneos/Runner.app" ]; then
            APP_DIR="build/ios/Debug-iphoneos/Runner.app"
          elif [ -d "build/ios/Release-iphoneos/Runner.app" ]; then
            APP_DIR="build/ios/Release-iphoneos/Runner.app"
          else
            echo "::error::Runner.app not found in any build output path"
            find build/ios -name "Runner.app" -type d 2>/dev/null || echo "No Runner.app found at all"
            exit 1
          fi
          echo "Found Runner.app at: $APP_DIR"
          mkdir Payload
          cp -r "$APP_DIR" Payload/
          zip -r cafe-app-unsigned.ipa Payload
          rm -rf Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: cafe-ios-ipa
          path: mobile/cafe-app-unsigned.ipa
          retention-days: 30
