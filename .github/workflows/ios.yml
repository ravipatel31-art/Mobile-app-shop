name: Build iOS IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-15
    defaults:
      run:
        working-directory: mobile
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build unsigned IPA
        env:
          API_BASE_URL: ${{ vars.API_BASE_URL }}
        run: |
          if [ -z "$API_BASE_URL" ]; then
            echo "::error::Repository variable API_BASE_URL is not set"
            exit 1
          fi
          SIM_NAME=$(xcrun simctl list devices available -j | python3 -c "
          import sys, json
          devs = json.load(sys.stdin)['devices']
          for runtime, devices in devs.items():
              for d in devices:
                  if d['isAvailable'] and 'iPhone' in d['name']:
                      print(d['name'])
                      sys.exit(0)
          ")
          echo "Targeting simulator: $SIM_NAME"
          flutter build ios --debug \
            -d "$SIM_NAME" \
            --dart-define=API_BASE_URL="$API_BASE_URL"
          mkdir Payload
          cp -r build/ios/simulator/Runner.app Payload/
          zip -r cafe-app-unsigned.ipa Payload
          rm -rf Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: cafe-ios-ipa
          path: mobile/cafe-app-unsigned.ipa
          retention-days: 30
